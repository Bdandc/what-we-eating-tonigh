name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run check:catalogue
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e

  # Gate at critical only: the remaining "high" advisories recommend literal
  # DOWNGRADES (next 9.3.3, eslint-config-next 12) — registry noise, not real
  # exposure. High-level findings stay visible in this job's log.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high || true
      - run: npm audit --audit-level=critical
